<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - GIF Cut-In Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: transparent;
      user-select: none;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      overflow: hidden;
      background: #0d0d0f;
    }

    .cut-in-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: drop-shadow(0 0 10px rgba(230,0,18,0.35));
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="../assets/Persona 5 Royal GIF.gif" class="cut-in-gif" alt="Persona 5 Cut-in">
  </div>

</body>
</html>
