<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Song Viewer (Now Playing)</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../theme-base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="p5-banner p5-music-root" id="musicRoot">
    
    <div class="p5-halftone-overlay" aria-hidden="true"></div>
    <div class="red-shape music-shard-top" aria-hidden="true"></div>
    <div class="red-shape music-shard-bot" aria-hidden="true"></div>
    <div class="music-speed-lines" aria-hidden="true"></div>

    <div class="mask-container music-mask-wrap" aria-hidden="true">
      <div class="mask-glow"></div>
      <img class="p5-mask" data-random-mask src="../assets/Joker Mask.png" alt="Phantom Mask" onerror="this.style.display='none';">
    </div>

    <main class="music-vertical-layout" id="mainLayout">

      <header class="music-header-bar">
        <div class="status-badge-wrap" id="statusBadgeWrap">
          <span class="badge-prefix" id="badgePrefix">BGM //</span>
          <span class="badge-title" id="statusBadge">NOW HIJACKING</span>
        </div>

        <div class="header-actions">
          <button class="sound-toggle-btn" id="soundToggleBtn" type="button" aria-label="Toggle Sound" title="Toggle Sound FX">
            <span class="sound-icon" id="soundIcon">🔊</span>
          </button>
        </div>
      </header>

      <section class="hero-album-stage" id="heroAlbumStage">
        <div class="starburst-frame-deco" aria-hidden="true">
          <div class="starburst-shard shard-1"></div>
          <div class="starburst-shard shard-2"></div>
          <div class="starburst-shard shard-3"></div>
        </div>

        <div class="album-art-card" id="albumArtCard">
          <img class="album-img" id="albumImg" src="" alt="Album Art" style="display: none;">
          
          <div class="album-halftone-screen" aria-hidden="true"></div>

          <div class="album-fallback" id="artFallback">
            <div class="fallback-vinyl-icon">♦</div>
            <span class="fallback-text">PHANTOM RADIO</span>
            <span class="fallback-sub">TAKEOVER</span>
          </div>

          <div class="p5-visualizer" id="visOverlay">
            <span class="vis-bar"></span>
            <span class="vis-bar"></span>
            <span class="vis-bar"></span>
            <span class="vis-bar"></span>
            <span class="vis-bar"></span>
          </div>
        </div>
      </section>

      <section class="track-details-block" id="trackDetailsBlock">
        <div class="title-marquee-window" id="titleMarqueeWindow">
          <h1 class="song-title" id="songTitle">RIVER IN THE DESERT</h1>
        </div>

        <div class="artist-ribbon" id="artistRibbon">
          <span class="ribbon-tag">ARTIST //</span>
          <span class="artist-name" id="artistName">Lyn Inaizumi</span>
          <span class="ribbon-sep">•</span>
          <span class="album-name" id="albumName">Persona 5 OST</span>
        </div>
      </section>

      <section class="progress-section" id="progressSection">
        <div class="meter-wrapper" id="meterWrapper">
          <div class="bar-track" id="barTrack">
            <div class="bar-hazard-bg"></div>
            <div class="bar-fill" id="trackProgress"></div>
          </div>

          <div class="meter-beacon" id="meterBeacon" aria-hidden="true">
            <div class="beacon-diamond"></div>
          </div>
        </div>

        <div class="timestamp-row">
          <span class="time-cur" id="timeCurrent">00:00</span>
          <span class="time-badge">PALACE SECURITY</span>
          <span class="time-dur" id="timeDuration">00:00</span>
        </div>
      </section>

      <section class="standby-calling-card" id="standbySection" style="display: none;">
        <div class="calling-card-badge">TARGET NOT FOUND</div>
        <h2 class="standby-headline">WAITING FOR PHANTOM SIGNAL</h2>
        <p class="standby-subtext" id="standbyHint">Play a track or scrobble via Last.fm to begin infiltration</p>
        
      </section>

    </main>

  </div>

  <script src="../../../shared/js/song-viewer-service.js"></script>
  <script src="script.js"></script>
</body>
</html>
