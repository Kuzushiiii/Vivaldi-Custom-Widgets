<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Calendar & Clock Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="p5-banner">
    <!-- Komik Poligon Merah -->
    <div class="red-shape rs-1"></div>
    <div class="red-shape rs-2"></div>
    <div class="red-shape rs-3"></div>

    <!-- Percikan Komik Putih -->
    <div class="spike spike-1"></div>
    <div class="spike spike-2"></div>
    <div class="spike spike-3"></div>

    <!-- Topeng Joker / Phantom Thieves -->
    <div class="mask-container">
      <div class="mask-glow"></div>
      <img class="p5-mask" src="../assets/Joker Mask.png" alt="Phantom Thieves Mask" onerror="this.style.display='none';">
    </div>

    <!-- Bintang Dekorasi -->
    <div class="star star-left">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#111" stroke="#e60012" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="star star-right">
      <svg width="76" height="76" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#141414" stroke="#e60012" stroke-width="2"/>
      </svg>
    </div>

    <!-- Konten Utama: Jam & Kalender -->
    <div class="content">
      <div class="left-col">
        <div class="clock">
          <span id="h1" class="num-red">0</span>
          <span id="h2" class="num-blue">0</span>
          <span class="colon">:</span>
          <span id="m1" class="num-green">0</span>
          <span id="m2" class="num-red">0</span>
        </div>
        <div class="day-text" id="dayLabel">TODAY</div>
        <div class="p5r-logo">
          <div class="p5r-emblem">P5R</div>
          <div class="p5r-sub">PERSONA</div>
        </div>
      </div>

      <div class="right-col">
        <div class="cal-month-wrap">
          <span class="cal-month" id="monthName">MONTH YEAR</span>
        </div>
        <div class="cal-header">
          <span class="sun">S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span class="sat">S</span>
        </div>
        <div class="cal-body" id="calBody"></div>
      </div>
    </div>
  </div>

  <script src="../../../shared/js/calendar-service.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCalendarWidget();
    });
  </script>
</body>
</html>
