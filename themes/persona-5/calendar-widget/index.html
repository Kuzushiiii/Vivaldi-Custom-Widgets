<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Calendar HUD Widget</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../theme-base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="p5-banner p5-calendar-root" id="calendarRoot" data-active-view="hud">
    
    <div class="p5-halftone-overlay" aria-hidden="true"></div>
    <div class="red-shape cal-shard-primary" aria-hidden="true"></div>
    <div class="red-shape cal-shard-secondary" aria-hidden="true"></div>
    <div class="red-shape cal-shard-accent" aria-hidden="true"></div>
    <div class="cal-speed-lines" aria-hidden="true"></div>

    <div class="mask-container cal-mask-wrap" aria-hidden="true">
      <div class="mask-glow"></div>
      <img class="p5-mask" data-random-mask src="../assets/Joker Mask.png" alt="Phantom Mask" onerror="this.style.display='none';">
    </div>

    <section class="cal-view cal-view-hud" id="hudView" aria-label="Today's Persona 5 Date HUD">
      
      <div class="hud-col hud-col-left">
        
        <div class="hud-phase-pill" id="timePhasePill" title="Current Daily Period">
          <span class="hud-phase-prefix">TIME //</span>
          <span class="hud-phase-text" id="phaseText">AFTER SCHOOL</span>
        </div>
        <div class="hud-phase-desc" id="phaseDesc">FREE TIME // INFILTRATE</div>

        <div class="hud-clock-row">
          <div class="clock ransom-clock" id="hudClock" title="Current Time">
            <span id="h1" class="clock-digit r-b">0</span>
            <span id="h2" class="clock-digit r-w">0</span>
            <span class="colon">:</span>
            <span id="m1" class="clock-digit r-r">0</span>
            <span id="m2" class="clock-digit r-b">0</span>
          </div>
          <span class="hud-ampm" id="ampmBadge">PM</span>
        </div>

        <div class="hud-actions-row">
          <button class="p5-action-trigger" id="openScheduleBtn" type="button" aria-label="Open Full Month Schedule" title="Click to unfold monthly schedule">
            <span class="trigger-dagger" aria-hidden="true">♦</span>
            <span class="trigger-text">SCHEDULE // 展開</span>
            <span class="trigger-arrow" aria-hidden="true">▶</span>
          </button>
          
          <button class="sound-toggle-btn" id="soundToggleBtn" type="button" aria-label="Toggle Sound Effects" title="Toggle Sound FX (Mute/Unmute)">
            <span class="sound-icon" id="soundIcon">🔊</span>
          </button>
        </div>

      </div>

      <div class="hud-col hud-col-right" id="hudCenterpiece" title="Click to view full calendar grid">
        
        <div class="hud-month-ribbon">
          <div class="ribbon-cutout">
            <span class="ribbon-month" id="hudMonthLabel">SEPTEMBER</span>
            <span class="ribbon-year" id="hudYearLabel">2026</span>
          </div>
          <div class="ribbon-star-wrap" title="Weather Condition">
            <svg class="p5-star-icon" viewBox="0 0 56 56" aria-hidden="true">
              <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20" fill="#FFE600" stroke="#000000" stroke-width="3"/>
            </svg>
          </div>
        </div>

        <div class="hud-day-stage" id="hudDayStage">
          <div class="ransom-digit-card digit-card-tens" id="dayDigitTens">
            <span class="digit-val" id="valDigitTens">1</span>
          </div>
          <div class="ransom-digit-card digit-card-ones" id="dayDigitOnes">
            <span class="digit-val" id="valDigitOnes">1</span>
          </div>
        </div>

        <div class="hud-weekday-slash" id="hudWeekday">
          <span class="weekday-prefix">//</span>
          <span class="weekday-name" id="hudWeekdayText">FRIDAY</span>
          <span class="weekday-exclaim">!</span>
        </div>

      </div>

    </section>

    <section class="cal-view cal-view-schedule" id="scheduleView" aria-label="Monthly Schedule Grid" aria-hidden="true">
      
      <div class="schedule-header">
        <button class="sched-nav-btn" id="prevMonthBtn" type="button" title="Previous Month" aria-label="Previous Month">◀</button>
        <div class="sched-title-wrap">
          <span class="sched-month-name" id="schedMonthName">SEPTEMBER</span>
          <span class="sched-year-name" id="schedYearName">2026</span>
        </div>
        <button class="sched-nav-btn" id="nextMonthBtn" type="button" title="Next Month" aria-label="Next Month">▶</button>
        
        <div class="sched-header-actions">
          <button class="sched-jump-btn" id="jumpTodayBtn" type="button" title="Jump to Today">TODAY</button>
          <button class="sched-close-btn" id="closeScheduleBtn" type="button" title="Return to Date HUD" aria-label="Close Schedule">✕</button>
        </div>
      </div>

      <div class="schedule-weekdays">
        <span class="sched-wday sun">SUN</span>
        <span class="sched-wday">MON</span>
        <span class="sched-wday">TUE</span>
        <span class="sched-wday">WED</span>
        <span class="sched-wday">THU</span>
        <span class="sched-wday">FRI</span>
        <span class="sched-wday sat">SAT</span>
      </div>

      <div class="schedule-grid" id="schedCalBody"></div>

      <div class="schedule-footer">
        <div class="sched-motto-wrap">
          <span class="sched-motto-dagger">♦</span>
          <span class="sched-motto-text">TAKE YOUR TIME</span>
          <span class="sched-motto-dagger">♦</span>
        </div>
        <div class="sched-tip">PRESS [ESC] OR [✕] TO RETURN</div>
      </div>

    </section>

  </div>

  <script src="../../../shared/js/calendar-service.js"></script>
  <script src="script.js"></script>
</body>
</html>
