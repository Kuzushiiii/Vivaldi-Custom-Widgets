<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Calendar & Clock Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600;700&family=Anton&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }

    /* ============ CONTAINER UTAMA ============ */
    .p5-banner {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #161518;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
      isolation: isolate;
    }

    /* Tekstur halftone dot */
    .p5-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.08) 1.2px, transparent 1.5px),
        radial-gradient(rgba(230,0,18,0.18) 1.2px, transparent 1.5px);
      background-size: 9px 9px, 13px 13px;
      background-position: 0 0, 3px 3px;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== Bentuk ledakan / sudut merah komik ===== */
    .red-shape {
      position: absolute;
      background: #e60012;
      z-index: 0;
      pointer-events: none;
    }
    .rs-1 {
      top: -12%;
      left: -6%;
      width: 50%;
      height: 60%;
      clip-path: polygon(0 0, 100% 0, 78% 22%, 100% 40%, 70% 55%, 88% 78%, 55% 70%, 60% 100%, 38% 72%, 12% 96%, 18% 60%, 0 70%, 14% 40%, 0 25%);
      transform: rotate(-2deg);
      opacity: 0.88;
    }
    .rs-2 {
      top: -6%;
      right: -6%;
      width: 42%;
      height: 52%;
      clip-path: polygon(40% 0, 100% 0, 100% 100%, 70% 60%, 88% 92%, 50% 64%, 30% 95%, 22% 50%, 0 40%);
      transform: rotate(3deg);
      opacity: 0.82;
    }
    .rs-3 {
      bottom: -10%;
      left: -4%;
      width: 32%;
      height: 45%;
      clip-path: polygon(0 30%, 30% 10%, 45% 38%, 70% 18%, 60% 50%, 100% 60%, 64% 70%, 80% 100%, 40% 78%, 20% 100%, 14% 64%, 0 60%);
      opacity: 0.5;
      background: #b3000e;
    }

    /* ===== Percikan / spike komik putih ===== */
    .spike {
      position: absolute;
      background: rgba(255,255,255,0.75);
      z-index: 1;
      pointer-events: none;
    }
    .spike-1 {
      top: -2%;
      left: 36%;
      width: 6%;
      height: 32%;
      clip-path: polygon(50% 0, 64% 50%, 100% 60%, 60% 74%, 50% 100%, 40% 74%, 0 60%, 36% 50%);
      transform: rotate(18deg);
      opacity: 0.85;
    }
    .spike-2 {
      bottom: -4%;
      left: 20%;
      width: 5%;
      height: 28%;
      clip-path: polygon(50% 0, 62% 52%, 100% 62%, 58% 76%, 50% 100%, 42% 76%, 0 62%, 38% 52%);
      transform: rotate(-24deg);
      opacity: 0.8;
    }
    .spike-3 {
      top: 18%;
      left: -3%;
      width: 4%;
      height: 22%;
      clip-path: polygon(50% 0, 62% 52%, 100% 62%, 58% 76%, 50% 100%, 42% 76%, 0 62%, 38% 52%);
      transform: rotate(40deg);
      opacity: 0.65;
    }

    /* ============ BINTANG ============ */
    .star {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 0 #000);
    }
    .star-left {
      left: 4%;
      bottom: 8%;
      transform: rotate(-12deg) scale(0.6);
      opacity: 0.85;
    }
    .star-right {
      right: 6%;
      top: 8%;
      transform: rotate(14deg) scale(0.85);
      opacity: 0.85;
    }

    /* ============ TOPENG (PHANTOM THIEVES MASK) ============ */
    .mask-container {
      position: absolute;
      bottom: 8%;
      left: 31%;
      width: 17%;
      max-width: 110px;
      min-width: 55px;
      z-index: 2;
      pointer-events: none;
      transform: rotate(-8deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mask-glow {
      position: absolute;
      inset: -10%;
      background: radial-gradient(circle, rgba(230,0,18,0.45) 0%, rgba(230,0,18,0) 70%);
      filter: blur(6px);
      z-index: -1;
    }
    .p5-mask {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 8px rgba(230, 0, 18, 0.9)) drop-shadow(2px 3px 0 #000) brightness(1.35) contrast(1.2);
      opacity: 0.98;
    }

    /* ============ KONTEN GRID ============ */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 3% 6% 3% 4%;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      grid-template-rows: 1fr;
      gap: 3%;
      align-content: center;
      align-items: center;
    }

    /* ===== KOLOM KIRI: JAM + HARI + LOGO P5R ===== */
    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ===== JAM ===== */
    .clock {
      background: #f3ead8;
      border: 2.5px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 2px 14px 4px 16px;
      transform: rotate(-2deg) skewX(-4deg);
      display: flex;
      align-items: baseline;
      font-family: 'Anton', sans-serif;
      font-size: clamp(28px, 7.5vw, 60px);
      line-height: 1;
      letter-spacing: -1px;
      width: max-content;
      justify-content: center;
    }
    .clock .num-red   { color: #e60012; }
    .clock .num-blue  { color: #1f5fb0; }
    .clock .num-green { color: #2f8f3f; }

    .clock .colon {
      color: #b0b0b0;
      padding: 0 4px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== HARI ===== */
    .day-text {
      font-family: 'Anton', sans-serif;
      font-size: clamp(14px, 3.2vw, 22px);
      color: #fff;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      transform: skewX(-4deg) rotate(-1deg);
      margin-top: 5px;
      text-align: center;
    }

    /* ===== LOGO P5R (Dipindah ke bawah Day Text agar tidak menutupi tanggal) ===== */
    .p5r-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 6px;
      transform: rotate(-2deg) skewX(-4deg);
      pointer-events: none;
    }
    .p5r-emblem {
      font-family: 'Anton', sans-serif;
      font-size: clamp(18px, 3.5vw, 26px);
      font-style: italic;
      color: #e60012;
      line-height: 0.85;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      letter-spacing: -0.5px;
    }
    .p5r-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(7px, 1.1vw, 10px);
      color: #fff;
      letter-spacing: 2.5px;
      margin-top: 2px;
      opacity: 0.85;
      text-shadow: 1px 1px 0 #000;
    }

    /* ===== KOLOM KANAN: KALENDER ===== */
    .right-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 2%;
      width: 100%;
    }

    .cal-month-wrap {
      text-align: center;
      margin-bottom: 4px;
    }
    .cal-month {
      display: inline-block;
      background: #ece2cf;
      color: #1a191b;
      font-family: 'Anton', sans-serif;
      font-size: clamp(10px, 2.3vw, 17px);
      letter-spacing: 1.5px;
      padding: 2px 12px;
      transform: rotate(-1deg) skewX(-5deg);
      box-shadow: 2px 2px 0 #000;
      border: 2px solid #000;
    }

    .cal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 2px;
    }
    .cal-header span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(9px, 1.8vw, 14px);
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.5px;
    }
    .cal-header span.sun { color: #ff5a5a; }
    .cal-header span.sat { color: #7fb2ff; }

    .cal-body {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 2px;
      text-align: center;
    }
    .cal-day {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: clamp(10px, 2.3vw, 17px);
      color: rgba(255,255,255,0.92);
      padding: 1px 0;
    }
    .cal-day.sun { color: #ff7a7a; }
    .cal-day.sat { color: #8fbcff; }
    .cal-day.prev-month { color: rgba(255,255,255,0.18); }

    .cal-day.today {
      position: relative;
      color: #fff !important;
    }
    .cal-day.today::after {
      content: "";
      position: absolute;
      inset: -1px;
      border: 2px solid #e60012;
      box-shadow: 0 0 8px rgba(230,0,18,0.6);
      pointer-events: none;
      border-radius: 2px;
    }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <div class="p5-banner">
    <!-- Komik Poligon Merah -->
    <div class="red-shape rs-1"></div>
    <div class="red-shape rs-2"></div>
    <div class="red-shape rs-3"></div>

    <!-- Percikan Komik Putih -->
    <div class="spike spike-1"></div>
    <div class="spike spike-2"></div>
    <div class="spike spike-3"></div>

    <!-- Topeng Joker / Phantom Thieves dengan Glow & Brightness Enhanced -->
    <div class="mask-container">
      <div class="mask-glow"></div>
      <img class="p5-mask" src="../assets/p5-mask.png" alt="Phantom Thieves Mask" onerror="this.style.display='none';">
    </div>

    <!-- Bintang Dekorasi -->
    <div class="star star-left">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#111" stroke="#e60012" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="star star-right">
      <svg width="76" height="76" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#141414" stroke="#e60012" stroke-width="2"/>
      </svg>
    </div>

    <!-- Konten Utama: Jam & Kalender -->
    <div class="content">
      <div class="left-col">
        <div class="clock">
          <span id="h1" class="num-red">0</span>
          <span id="h2" class="num-blue">0</span>
          <span class="colon">:</span>
          <span id="m1" class="num-green">0</span>
          <span id="m2" class="num-red">0</span>
        </div>
        <div class="day-text" id="dayLabel">TODAY</div>
        <div class="p5r-logo">
          <div class="p5r-emblem">P5R</div>
          <div class="p5r-sub">PERSONA</div>
        </div>
      </div>

      <div class="right-col">
        <div class="cal-month-wrap">
          <span class="cal-month" id="monthName">MONTH YEAR</span>
        </div>
        <div class="cal-header">
          <span class="sun">S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span class="sat">S</span>
        </div>
        <div class="cal-body" id="calBody"></div>
      </div>
    </div>
  </div>

  <script>
    const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    const DAYS_SHORT = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];

    function pad(n) { return String(n).padStart(2, '0'); }

    function buildCalendar(year, month, today) {
      const body = document.getElementById('calBody');
      body.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevDaysCount = new Date(year, month, 0).getDate();

      // Hari bulan sebelumnya
      for (let i = 0; i < firstDayIndex; i++) {
        const d = document.createElement('div');
        d.className = 'cal-day prev-month';
        if (i === 0) d.classList.add('sun');
        d.textContent = prevDaysCount - firstDayIndex + 1 + i;
        body.appendChild(d);
      }

      // Hari bulan berjalan
      for (let day = 1; day <= daysInMonth; day++) {
        const d = document.createElement('div');
        const currentColumn = (firstDayIndex + day - 1) % 7;
        d.className = 'cal-day';
        if (currentColumn === 0) d.classList.add('sun');
        if (currentColumn === 6) d.classList.add('sat');
        if (today && day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          d.classList.add('today');
        }
        d.textContent = day;
        body.appendChild(d);
      }

      // Hari bulan berikutnya untuk melengkapi baris grid
      const totalCells = firstDayIndex + daysInMonth;
      const remainingCells = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= remainingCells; i++) {
        const d = document.createElement('div');
        d.className = 'cal-day prev-month';
        const currentColumn = (totalCells + i - 1) % 7;
        if (currentColumn === 0) d.classList.add('sun');
        if (currentColumn === 6) d.classList.add('sat');
        d.textContent = i;
        body.appendChild(d);
      }
    }

    function updateClock() {
      const now = new Date();
      const h = pad(now.getHours());
      const m = pad(now.getMinutes());

      document.getElementById('h1').textContent = h[0];
      document.getElementById('h2').textContent = h[1];
      document.getElementById('m1').textContent = m[0];
      document.getElementById('m2').textContent = m[1];

      document.getElementById('monthName').textContent = MONTHS[now.getMonth()] + ' ' + now.getFullYear();
      document.getElementById('dayLabel').textContent = DAYS_SHORT[now.getDay()];

      buildCalendar(now.getFullYear(), now.getMonth(), now);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
