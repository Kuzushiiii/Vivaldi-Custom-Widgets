<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Calendar & Clock Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="p5-banner">
    <!-- Unique Calendar Polygons -->
    <div class="red-shape cal-shape-1"></div>
    <div class="red-shape cal-shape-2"></div>
    <div class="red-shape cal-shape-3"></div>

    <!-- Percikan Komik Putih -->
    <div class="spike cal-spike-1"></div>

    <!-- Random Mask Accent with Glow (Positioned at bottom-center of left col) -->
    <div class="mask-container cal-mask">
      <div class="mask-glow"></div>
      <img class="p5-mask" data-random-mask src="../assets/Akechi Mask.png" alt="Phantom Mask" onerror="this.style.display='none';">
    </div>

    <!-- Single Beautiful P5 Star (No duplicates!) -->
    <div class="cal-star-left">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#141414" stroke="#e60012" stroke-width="2.5"/>
      </svg>
    </div>

    <!-- Konten Utama: Jam & Kalender -->
    <div class="content">
      <div class="left-col">
        <!-- Ransom-Note Clock digits! -->
        <div class="clock ransom-clock">
          <span id="h1" class="clock-digit r-b">0</span>
          <span id="h2" class="clock-digit r-w">0</span>
          <span class="colon">:</span>
          <span id="m1" class="clock-digit r-r">0</span>
          <span id="m2" class="clock-digit r-b">0</span>
        </div>
        <div class="day-text" id="dayLabel">TODAY</div>
        <div class="p5r-logo">
          <div class="p5r-emblem">P5R</div>
          <div class="p5r-sub">PERSONA</div>
        </div>
      </div>

      <div class="right-col">
        <div class="cal-month-wrap">
          <span class="cal-month" id="monthName">MONTH YEAR</span>
        </div>
        <div class="cal-header">
          <span class="sun">S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span class="sat">S</span>
        </div>
        <div class="cal-body" id="calBody"></div>
      </div>
    </div>
  </div>

  <script src="../../../shared/js/mask-randomizer.js"></script>
  <script src="../../../shared/js/calendar-service.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCalendarWidget();
    });
  </script>
</body>
</html>
