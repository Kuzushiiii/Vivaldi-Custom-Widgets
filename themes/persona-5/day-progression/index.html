<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Day Progression Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600;700&family=Anton&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }

    /* ============ CONTAINER UTAMA ============ */
    .p5-banner {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #141316;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
      isolation: isolate;
    }

    /* Halftone dot pattern */
    .p5-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.07) 1.2px, transparent 1.5px),
        radial-gradient(rgba(230,0,18,0.18) 1.2px, transparent 1.5px);
      background-size: 9px 9px, 13px 13px;
      background-position: 0 0, 3px 3px;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== Comic Red Splashes ===== */
    .red-shape {
      position: absolute;
      background: #e60012;
      z-index: 0;
      pointer-events: none;
    }
    .rs-1 {
      top: -15%;
      left: -8%;
      width: 55%;
      height: 65%;
      clip-path: polygon(0 0, 100% 0, 78% 22%, 100% 40%, 70% 55%, 88% 78%, 55% 70%, 60% 100%, 38% 72%, 12% 96%, 18% 60%, 0 70%, 14% 40%, 0 25%);
      transform: rotate(-2deg);
      opacity: 0.88;
    }
    .rs-2 {
      bottom: -15%;
      right: -8%;
      width: 45%;
      height: 60%;
      clip-path: polygon(40% 0, 100% 0, 100% 100%, 70% 60%, 88% 92%, 50% 64%, 30% 95%, 22% 50%, 0 40%);
      transform: rotate(3deg);
      opacity: 0.8;
    }
    .rs-3 {
      top: -10%;
      right: 15%;
      width: 25%;
      height: 35%;
      clip-path: polygon(0 30%, 30% 10%, 45% 38%, 70% 18%, 60% 50%, 100% 60%, 64% 70%, 80% 100%, 40% 78%, 20% 100%, 14% 64%, 0 60%);
      opacity: 0.45;
      background: #b3000e;
    }

    /* ===== Comic Spikes ===== */
    .spike {
      position: absolute;
      background: rgba(255,255,255,0.75);
      z-index: 1;
      pointer-events: none;
    }
    .spike-1 {
      top: 10%;
      right: 28%;
      width: 4%;
      height: 25%;
      clip-path: polygon(50% 0, 64% 50%, 100% 60%, 60% 74%, 50% 100%, 40% 74%, 0 60%, 36% 50%);
      transform: rotate(25deg);
      opacity: 0.8;
    }
    .spike-2 {
      bottom: -4%;
      left: 32%;
      width: 5%;
      height: 24%;
      clip-path: polygon(50% 0, 62% 52%, 100% 62%, 58% 76%, 50% 100%, 42% 76%, 0 62%, 38% 52%);
      transform: rotate(-24deg);
      opacity: 0.75;
    }

    /* ===== Stars ===== */
    .star {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }
    .star-left {
      left: 4%;
      bottom: 8%;
      transform: rotate(-10deg) scale(0.65);
      opacity: 0.85;
    }
    .star-right {
      right: 4%;
      top: 8%;
      transform: rotate(15deg) scale(0.75);
      opacity: 0.85;
    }

    /* ============ MAIN CONTENT LAYOUT ============ */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 3.5% 6% 3.5% 6%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ===== TOP ROW: Phase Badge & Clock ===== */
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      background: #ece2cf;
      border: 2.5px solid #000;
      box-shadow: 3px 3px 0 #000;
      padding: 3px 12px;
      transform: rotate(-2deg) skewX(-5deg);
    }
    .phase-icon {
      font-size: clamp(12px, 2.2vw, 18px);
      margin-right: 6px;
    }
    .phase-title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(13px, 2.8vw, 22px);
      letter-spacing: 1.5px;
      color: #1a191b;
      text-transform: uppercase;
    }

    .time-badge {
      display: inline-flex;
      align-items: center;
      background: #111;
      border: 2px solid #e60012;
      box-shadow: 3px 3px 0 #000;
      padding: 3px 10px;
      transform: rotate(1deg) skewX(-4deg);
    }
    .time-text {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 2.4vw, 18px);
      color: #fff;
      letter-spacing: 1px;
    }

    /* ===== MIDDLE ROW: Big Percentage Display & Title ===== */
    .mid-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 4px 0;
    }

    .slogan-wrap {
      display: flex;
      flex-direction: column;
    }
    .slogan-main {
      font-family: 'Anton', sans-serif;
      font-size: clamp(16px, 3.8vw, 30px);
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      transform: skewX(-4deg);
      line-height: 1;
    }
    .slogan-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(9px, 1.8vw, 14px);
      color: rgba(255,255,255,0.7);
      letter-spacing: 2px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .percent-display {
      display: flex;
      align-items: baseline;
      font-family: 'Anton', sans-serif;
      transform: rotate(-2deg) skewX(-4deg);
    }
    .percent-val {
      font-size: clamp(34px, 8.5vw, 68px);
      line-height: 0.9;
      color: #e60012;
      text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }
    .percent-unit {
      font-size: clamp(18px, 4vw, 32px);
      color: #f3ead8;
      margin-left: 2px;
      text-shadow: 2px 2px 0 #000;
    }

    /* ===== PROGRESS BAR SECTION ===== */
    .bar-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bar-track-wrap {
      position: relative;
      width: 100%;
      height: clamp(18px, 4vw, 30px);
      background: #000;
      border: 2.5px solid #000;
      box-shadow: 4px 4px 0 #000;
      transform: skewX(-6deg);
      overflow: hidden;
    }

    .bar-bg-stripe {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        #1c1c20,
        #1c1c20 8px,
        #2a2930 8px,
        #2a2930 16px
      );
      z-index: 1;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #b3000e 0%, #e60012 70%, #ff2a3a 100%);
      z-index: 2;
      transition: width 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), inset 0 -2px 0 rgba(0,0,0,0.5);
    }
    .bar-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.15),
        rgba(255,255,255,0.15) 6px,
        transparent 6px,
        transparent 12px
      );
      animation: moveStripe 20s linear infinite;
    }
    @keyframes moveStripe {
      from { background-position: 0 0; }
      to { background-position: 200px 0; }
    }

    /* ===== BOTTOM ROW: Time Milestones / Remaining Info ===== */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }

    .time-remaining {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(10px, 2vw, 15px);
      color: rgba(255,255,255,0.85);
      letter-spacing: 1.5px;
      text-shadow: 1px 1px 0 #000;
    }
    .time-remaining span {
      color: #ff4a5a;
      font-weight: bold;
    }

    .p5-motto {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Anton', sans-serif;
      font-size: clamp(11px, 2.2vw, 16px);
      color: #e60012;
      letter-spacing: 1.5px;
      font-style: italic;
      text-shadow: 1px 1px 0 #000;
      transform: skewX(-4deg);
    }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <div class="p5-banner">
    <!-- Red Comic Splashes -->
    <div class="red-shape rs-1"></div>
    <div class="red-shape rs-2"></div>
    <div class="red-shape rs-3"></div>

    <!-- White Comic Spikes -->
    <div class="spike spike-1"></div>
    <div class="spike spike-2"></div>

    <!-- Stars -->
    <div class="star star-left">
      <svg width="50" height="50" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#111" stroke="#e60012" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="star star-right">
      <svg width="64" height="64" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#141414" stroke="#e60012" stroke-width="2"/>
      </svg>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Top Row: Time Phase & Live Clock -->
      <div class="top-row">
        <div class="phase-badge">
          <span class="phase-icon" id="phaseIcon">⛅</span>
          <span class="phase-title" id="phaseTitle">AFTER SCHOOL</span>
        </div>
        <div class="time-badge">
          <span class="time-text" id="liveTime">00:00:00</span>
        </div>
      </div>

      <!-- Mid Row: Title & Percentage -->
      <div class="mid-row">
        <div class="slogan-wrap">
          <div class="slogan-main">DAY PROGRESSION</div>
          <div class="slogan-sub" id="phaseDesc">TAKE YOUR TIME • STEAL THE DAY</div>
        </div>
        <div class="percent-display">
          <span class="percent-val" id="percentNum">00.0</span>
          <span class="percent-unit">%</span>
        </div>
      </div>

      <!-- Progress Bar Track -->
      <div class="bar-section">
        <div class="bar-track-wrap">
          <div class="bar-bg-stripe"></div>
          <div class="bar-fill" id="progFill"></div>
        </div>
      </div>

      <!-- Bottom Row: Time Remaining & Motto -->
      <div class="bottom-row">
        <div class="time-remaining">
          TIME LEFT TODAY: <span id="timeLeft">00H 00M</span>
        </div>
        <div class="p5-motto">
          <span>TAKE YOUR TIME</span>
          <svg width="14" height="14" viewBox="0 0 56 56">
            <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
              fill="#e60012" stroke="#000" stroke-width="3"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    function pad(n) { return String(n).padStart(2, '0'); }

    function getTimePhase(hours, minutes) {
      const totalMinutes = hours * 60 + minutes;

      // 00:00 - 05:59: LATE NIGHT
      if (totalMinutes < 6 * 60) {
        return {
          title: 'LATE NIGHT',
          icon: '🌙',
          desc: 'DARK HOUR • REST WELL PHANTOM'
        };
      }
      // 06:00 - 08:29: EARLY MORNING
      if (totalMinutes < 8 * 60 + 30) {
        return {
          title: 'EARLY MORNING',
          icon: '🌅',
          desc: 'MORNING COMMUTE • READY UP'
        };
      }
      // 08:30 - 12:29: MORNING CLASS
      if (totalMinutes < 12 * 60 + 30) {
        return {
          title: 'DAYTIME',
          icon: '☀️',
          desc: 'SHUJIN ACADEMY • PAY ATTENTION'
        };
      }
      // 12:30 - 15:29: AFTERNOON
      if (totalMinutes < 15 * 60 + 30) {
        return {
          title: 'AFTERNOON',
          icon: '🌤️',
          desc: 'CLASS IN SESSION • STAY SHARP'
        };
      }
      // 15:30 - 18:59: AFTER SCHOOL
      if (totalMinutes < 19 * 60) {
        return {
          title: 'AFTER SCHOOL',
          icon: '🌇',
          desc: 'FREE ACTIVITY • INFILTRATE PALACE'
        };
      }
      // 19:00 - 23:59: EVENING
      return {
        title: 'EVENING',
        icon: '🌆',
        desc: 'YONGEN-JAYA NIGHTS • CHILL AT LEBLANC'
      };
    }

    function updateDayProgression() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const ms = now.getMilliseconds();

      // Hitung total detik yang telah berlalu hari ini
      const totalSecondsPassed = (h * 3600) + (m * 60) + s + (ms / 1000);
      const totalSecondsInDay = 86400; // 24 * 3600

      const percent = (totalSecondsPassed / totalSecondsInDay) * 100;
      const formattedPercent = percent.toFixed(1);

      // Hitung sisa waktu hari ini
      const remainingSeconds = Math.max(0, totalSecondsInDay - totalSecondsPassed);
      const remHours = Math.floor(remainingSeconds / 3600);
      const remMinutes = Math.floor((remainingSeconds % 3600) / 60);

      // Update Phase
      const phase = getTimePhase(h, m);
      document.getElementById('phaseIcon').textContent = phase.icon;
      document.getElementById('phaseTitle').textContent = phase.title;
      document.getElementById('phaseDesc').textContent = phase.desc;

      // Update Live Clock
      document.getElementById('liveTime').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

      // Update Percentage & Progress Bar
      document.getElementById('percentNum').textContent = formattedPercent;
      document.getElementById('progFill').style.width = `${percent}%`;

      // Update Time Left
      document.getElementById('timeLeft').textContent = `${pad(remHours)}H ${pad(remMinutes)}M`;
    }

    updateDayProgression();
    setInterval(updateDayProgression, 1000);
  </script>
</body>
</html>
