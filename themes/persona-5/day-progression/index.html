<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Day Progression Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="p5-banner">
    <!-- Unique Day Progression Comic Shapes -->
    <div class="red-shape day-shape-1"></div>
    <div class="red-shape day-shape-2"></div>
    <div class="red-shape day-shape-3"></div>

    <!-- Speed Lines Accent -->
    <div class="day-speed-lines"></div>

    <!-- White Comic Spikes -->
    <div class="spike day-spike-1"></div>

    <!-- Stars -->
    <div class="star star-left">
      <svg width="48" height="48" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#111" stroke="#e60012" stroke-width="2.5"/>
      </svg>
    </div>

    <!-- Random Mask Accent - Positioned stylishly in empty center-right area -->
    <div class="mask-container day-mask">
      <div class="mask-glow"></div>
      <img class="p5-mask" data-random-mask src="../assets/Ann Mask.png" alt="Phantom Mask" onerror="this.style.display='none';">
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Top Row: Time Phase & Live Clock -->
      <div class="top-row">
        <div class="phase-badge">
          <span class="phase-prefix">TIME //</span>
          <span class="phase-title" id="phaseTitle">AFTER SCHOOL</span>
        </div>
        <div class="time-badge">
          <span class="time-text" id="liveTime">00:00:00</span>
        </div>
      </div>

      <!-- Mid Row: Title & Percentage -->
      <div class="mid-row">
        <div class="slogan-wrap">
          <!-- Ransom-Note Styled Title -->
          <!-- Letters are grouped per word (.ransom-word) so that if the
               row ever runs out of space, a whole word wraps to the next
               line instead of a single stray letter breaking off. -->
          <div class="slogan-main ransom-title">
            <span class="ransom-word">
              <span class="ransom-box r-b">D</span>
              <span class="ransom-box r-w">A</span>
              <span class="ransom-box r-r">Y</span>
            </span>
            <span class="ransom-word">
              <span class="ransom-box r-w">P</span>
              <span class="ransom-box r-b">R</span>
              <span class="ransom-box r-r">O</span>
              <span class="ransom-box r-w">G</span>
              <span class="ransom-box r-b">R</span>
              <span class="ransom-box r-w">E</span>
              <span class="ransom-box r-r">S</span>
              <span class="ransom-box r-b">S</span>
              <span class="ransom-box r-w">I</span>
              <span class="ransom-box r-r">O</span>
              <span class="ransom-box r-b">N</span>
            </span>
          </div>
          <div class="slogan-sub" id="phaseDesc">TAKE YOUR TIME • STEAL THE DAY</div>
        </div>
        <div class="percent-display">
          <span class="percent-val" id="percentNum">00.0</span>
          <span class="percent-unit">%</span>
        </div>
      </div>

      <!-- Progress Bar Track -->
      <div class="bar-section">
        <div class="bar-track-wrap">
          <div class="bar-bg-stripe"></div>
          <div class="bar-fill" id="progFill"></div>
        </div>
      </div>

      <!-- Bottom Row: Time Remaining & Motto -->
      <div class="bottom-row">
        <div class="time-remaining">
          TIME LEFT TODAY: <span id="timeLeft">00H 00M</span>
        </div>
        <div class="p5-motto">
          <span>TAKE YOUR TIME</span>
          <svg width="14" height="14" viewBox="0 0 56 56">
            <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
              fill="#e60012" stroke="#000" stroke-width="3"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../shared/js/mask-randomizer.js"></script>
  <script src="../../../shared/js/day-progression.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initDayProgressionWidget();
    });
  </script>
</body>
</html>
