<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Day Progression Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="p5-banner p5-day-root" id="dayProgRoot">
    
    <div class="p5-halftone-overlay" aria-hidden="true"></div>
    <div class="red-shape day-shard-primary" aria-hidden="true"></div>
    <div class="red-shape day-shard-secondary" aria-hidden="true"></div>
    <div class="red-shape day-shard-accent" aria-hidden="true"></div>
    <div class="day-speed-lines" aria-hidden="true"></div>

    <div class="mask-container day-mask-wrap" aria-hidden="true">
      <div class="mask-glow"></div>
      <img class="p5-mask" data-random-mask src="../assets/Ann Mask.png" alt="Phantom Mask" onerror="this.style.display='none';">
    </div>

    <main class="day-content" id="dayContent">
      
      <header class="day-top-row">
        <div class="phase-pill-wrap" id="phasePill" title="Current Time Period">
          <span class="phase-prefix">TIME //</span>
          <span class="phase-title" id="phaseTitle">AFTER SCHOOL</span>
        </div>

        <div class="day-status-tag" id="dayStatusTag" title="Day Mission Status">
          <span class="tag-dagger" aria-hidden="true">♦</span>
          <span class="tag-label">INFILTRATION RATE</span>
        </div>

        <button class="sound-toggle-btn" id="soundToggleBtn" type="button" aria-label="Toggle Sound Effects" title="Toggle Sound FX (Mute/Unmute)">
          <span class="sound-icon" id="soundIcon">🔊</span>
        </button>
      </header>

      <section class="day-mid-row">
        
        <div class="ransom-percent-stage" id="percentStage" title="Percentage of day elapsed">
          <div class="ransom-digit-card r-digit-tens" id="pctTens">
            <span class="digit-val" id="valPctTens">0</span>
          </div>
          <div class="ransom-digit-card r-digit-ones" id="pctOnes">
            <span class="digit-val" id="valPctOnes">0</span>
          </div>
          <div class="ransom-dot" id="pctDot" aria-hidden="true">♦</div>
          <div class="ransom-digit-card r-digit-tenths" id="pctTenths">
            <span class="digit-val" id="valPctTenths">0</span>
          </div>
          <div class="ransom-percent-badge" id="pctBadge">%</div>
        </div>

        <div class="day-meta-block">
          <div class="slogan-badge" id="sloganBadge">
            <span class="slogan-text" id="phaseDesc">FREE TIME // INFILTRATE PALACE</span>
          </div>
          <div class="time-left-box" id="timeLeftBox">
            <span class="time-left-label">TIME LEFT:</span>
            <span class="time-left-val" id="timeLeft">00H 00M</span>
          </div>
        </div>

      </section>

      <section class="day-meter-section" title="Day Progression Track">
        <div class="meter-wrapper" id="meterWrapper">
          <div class="meter-track-frame" id="meterTrackFrame">
            <div class="meter-bg-hazard" aria-hidden="true"></div>
            <div class="meter-fill-bar" id="progFill"></div>
          </div>

          <div class="meter-leading-beacon" id="meterBeacon" aria-hidden="true" title="Progress Beacon">
            <svg class="beacon-star" viewBox="0 0 56 56">
              <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20" fill="#FFE600" stroke="#000000" stroke-width="3"/>
            </svg>
          </div>
        </div>

        <div class="meter-footer">
          <span class="meter-edge-label start">00:00 [START]</span>
          <div class="meter-center-motto">
            <span class="motto-dagger" aria-hidden="true">♦</span>
            <span>STEAL THE DAY // TAKE YOUR TIME</span>
            <span class="motto-dagger" aria-hidden="true">♦</span>
          </div>
          <span class="meter-edge-label end">24:00 [DEADLINE]</span>
        </div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
