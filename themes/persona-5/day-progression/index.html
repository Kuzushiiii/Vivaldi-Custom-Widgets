<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona 5 - Day Progression Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="p5-banner">
    <!-- Red Comic Splashes -->
    <div class="red-shape rs-1"></div>
    <div class="red-shape rs-2"></div>
    <div class="red-shape rs-3"></div>

    <!-- White Comic Spikes -->
    <div class="spike spike-1"></div>
    <div class="spike spike-2"></div>

    <!-- Stars -->
    <div class="star star-left">
      <svg width="50" height="50" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#111" stroke="#e60012" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="star star-right">
      <svg width="64" height="64" viewBox="0 0 56 56">
        <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
          fill="#141414" stroke="#e60012" stroke-width="2"/>
      </svg>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Top Row: Time Phase & Live Clock -->
      <div class="top-row">
        <div class="phase-badge">
          <span class="phase-prefix">TIME //</span>
          <span class="phase-title" id="phaseTitle">AFTER SCHOOL</span>
        </div>
        <div class="time-badge">
          <span class="time-text" id="liveTime">00:00:00</span>
        </div>
      </div>

      <!-- Mid Row: Title & Percentage -->
      <div class="mid-row">
        <div class="slogan-wrap">
          <div class="slogan-main">DAY PROGRESSION</div>
          <div class="slogan-sub" id="phaseDesc">TAKE YOUR TIME • STEAL THE DAY</div>
        </div>
        <div class="percent-display">
          <span class="percent-val" id="percentNum">00.0</span>
          <span class="percent-unit">%</span>
        </div>
      </div>

      <!-- Progress Bar Track -->
      <div class="bar-section">
        <div class="bar-track-wrap">
          <div class="bar-bg-stripe"></div>
          <div class="bar-fill" id="progFill"></div>
        </div>
      </div>

      <!-- Bottom Row: Time Remaining & Motto -->
      <div class="bottom-row">
        <div class="time-remaining">
          TIME LEFT TODAY: <span id="timeLeft">00H 00M</span>
        </div>
        <div class="p5-motto">
          <span>TAKE YOUR TIME</span>
          <svg width="14" height="14" viewBox="0 0 56 56">
            <polygon points="28,2 34,20 54,20 38,32 44,52 28,40 12,52 18,32 2,20 22,20"
              fill="#e60012" stroke="#000" stroke-width="3"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../shared/js/day-progression.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initDayProgressionWidget();
    });
  </script>
</body>
</html>
