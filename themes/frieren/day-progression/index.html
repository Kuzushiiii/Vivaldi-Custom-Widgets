<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frieren: Beyond Journey's End — Day Progression</title>

  <!-- Typography: Online Google Fonts + Local Offline Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../violet-evergarden/assets/fonts/fonts.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../theme-base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="frieren-widget" id="frierenDayRoot" data-theme="parchment">
    
    <!-- Grimoire Ancient Parchment Filter & Background Texture Layer -->
    <div class="grimoire-texture-overlay" aria-hidden="true"></div>

    <!-- Delicate Grimoire Frame with Elven Corner Filigrees -->
    <div class="grimoire-frame" aria-hidden="true">
      <div class="corner-filigree top-left">
        <svg viewBox="0 0 32 32" class="filigree-svg">
          <path d="M2,2 L14,2 C8,2 2,8 2,14 Z M2,2 L2,24 M2,2 L24,2 M6,6 L16,6 M6,6 L6,16" stroke="currentColor" fill="none" stroke-width="1"/>
          <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="corner-filigree top-right">
        <svg viewBox="0 0 32 32" class="filigree-svg">
          <path d="M30,2 L18,2 C24,2 30,8 30,14 Z M30,2 L30,24 M30,2 L8,2 M26,6 L16,6 M26,6 L26,16" stroke="currentColor" fill="none" stroke-width="1"/>
          <circle cx="24" cy="8" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="corner-filigree bottom-left">
        <svg viewBox="0 0 32 32" class="filigree-svg">
          <path d="M2,30 L14,30 C8,30 2,24 2,18 Z M2,30 L2,8 M2,30 L24,30 M6,26 L16,26 M6,26 L6,16" stroke="currentColor" fill="none" stroke-width="1"/>
          <circle cx="8" cy="24" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="corner-filigree bottom-right">
        <svg viewBox="0 0 32 32" class="filigree-svg">
          <path d="M30,30 L18,30 C24,30 30,24 30,18 Z M30,30 L30,8 M30,30 L8,30 M26,26 L16,26 M26,26 L26,16" stroke="currentColor" fill="none" stroke-width="1"/>
          <circle cx="24" cy="24" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="grimoire-inner-border"></div>
    </div>

    <!-- Main Widget Surface -->
    <main class="grimoire-content" id="grimoireContent">
      
      <!-- Top Row: Temporal Era & Chronometer -->
      <header class="temporal-header">
        
        <div class="epoch-badge" title="Temporal Phase & Atmosphere">
          <span class="rune-glyph">✧</span>
          <span class="epoch-title" id="phaseTitle">ERA OF PEACE · MIDDAY</span>
        </div>

        <div class="temporal-actions">
          <button class="theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Toggle Grimoire / Night Sky Theme" title="Switch Atmosphere (Parchment / Night Sky)">
            <span class="theme-icon" id="themeIcon">☽</span>
          </button>

          <div class="chronos-stats">
            <span class="live-clock" id="liveClock" title="Local Time">00:00:00</span>
            <span class="stat-divider" aria-hidden="true">·</span>
            <span class="percent-readout" title="Day Elapsed"><strong id="percentNum">00.0</strong>%</span>
          </div>
        </div>

      </header>

      <!-- The Core Lore Subtitle (Himmel Chronology) -->
      <section class="himmel-chronicle-section" aria-label="Hero Himmel Chronology">
        <div class="himmel-ribbon">
          <span class="chronicle-flourish left" aria-hidden="true">✦</span>
          <h2 class="himmel-text" id="himmelLoreText">
            Day 1 after the passing of Hero Himmel.
          </h2>
          <span class="chronicle-flourish right" aria-hidden="true">✦</span>
        </div>
        <p class="phase-desc" id="phaseDesc">A calm, unhurried journey through eternal grasslands</p>
      </section>

      <!-- The Mana Stream (Delicate Track & Glowing Fill) -->
      <section class="mana-stream-section" aria-label="Today's Mana Stream">
        <div class="stream-track-container" id="streamContainer">
          
          <!-- Background Cartographic Map Route Line -->
          <div class="stream-track-line" id="streamTrack">
            
            <!-- Flowing Cyan Mana Stream Fill -->
            <div class="mana-stream-fill" id="manaFill" style="width: 0%;">
              <div class="mana-inner-glint"></div>
            </div>

            <!-- Soft Map Station Nodes -->
            <div class="track-node node-0" aria-hidden="true"></div>
            <div class="track-node node-25" aria-hidden="true"></div>
            <div class="track-node node-50" aria-hidden="true"></div>
            <div class="track-node node-75" aria-hidden="true"></div>
            <div class="track-node node-100" aria-hidden="true"></div>
          </div>

          <!-- The Beacon: Blue Moon Weed (Mirigrahl) Floral Silhouette -->
          <div class="mana-beacon" id="manaBeacon" aria-hidden="true" title="Blue Moon Weed (Mirigrahl)">
            <div class="beacon-halo"></div>
            <div class="beacon-glow-ring"></div>
            
            <!-- Elegant 5-Petal Blue Moon Weed Vector -->
            <svg class="flower-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Luminous Mana Gradient for Petals -->
                <radialGradient id="manaPetalGrad" cx="50%" cy="40%" r="60%">
                  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
                  <stop offset="45%" stop-color="#BAE6FD" stop-opacity="0.9"/>
                  <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.85"/>
                  <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8"/>
                </radialGradient>
                <filter id="gentleGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="1" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
              </defs>
              
              <!-- Floral Silhouette: Blue Moon Weed Blossom -->
              <g filter="url(#gentleGlow)">
                <!-- Petal Top -->
                <path d="M18 16 C16 9, 20 9, 18 4 C16 9, 20 9, 18 16 Z" fill="url(#manaPetalGrad)" />
                <!-- Petal Top-Right -->
                <path d="M18 16 C25 12, 27 15, 29 12 C25 17, 24 19, 18 16 Z" fill="url(#manaPetalGrad)" />
                <!-- Petal Bottom-Right -->
                <path d="M18 16 C25 21, 25 25, 26 27 C21 24, 20 22, 18 16 Z" fill="url(#manaPetalGrad)" />
                <!-- Petal Bottom-Left -->
                <path d="M18 16 C11 21, 11 25, 10 27 C15 24, 16 22, 18 16 Z" fill="url(#manaPetalGrad)" />
                <!-- Petal Top-Left -->
                <path d="M18 16 C11 12, 9 15, 7 12 C11 17, 12 19, 18 16 Z" fill="url(#manaPetalGrad)" />
                
                <!-- Radiant Golden Flower Pistil -->
                <circle cx="18" cy="16" r="2.2" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.5"/>
                <!-- Central Mana Core Spark -->
                <circle cx="18" cy="16" r="0.8" fill="#FFFFFF"/>
                
                <!-- Slender Stem & Leaflet -->
                <path d="M18 18.5 Q18 26 18 31" stroke="#0284C7" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
                <path d="M18 23 Q21 21 22 23" stroke="#38BDF8" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
              </g>
            </svg>
          </div>

        </div>

        <!-- Telemetry Footer: Dawn, Remaining, Night -->
        <footer class="stream-telemetry">
          <span class="telemetry-point start">
            <span class="tel-glyph">❖</span> 00:00 [Dawn]
          </span>
          <span class="telemetry-countdown" id="timeLeft">
            Time Left: --h --m
          </span>
          <span class="telemetry-point end">
            24:00 [Night] <span class="tel-glyph">❖</span>
          </span>
        </footer>

      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
