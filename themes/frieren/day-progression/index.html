<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frieren: Beyond Journey's End: Day Progression (Stark)</title>

  <!-- Typography: Majestic Fantasy Serif (Cinzel / Marcellus) + Clean Athletic Numerals (Quicksand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Marcellus&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Vanguard Widget Container -->
  <article class="stark-widget" id="dayProgressionWidget">

    <!-- Top Lore Header: Vanguard Badge & Day Cleave Readout -->
    <header class="vanguard-header">
      <div class="vanguard-badge">
        <span class="vanguard-gem" aria-hidden="true">❖</span>
        <span class="vanguard-title">VANGUARD · STARK</span>
      </div>

      <div class="cleave-readout" title="Day Progression Elapsed">
        <span class="cleave-label">CLEAVED:</span>
        <strong class="cleave-percent" id="percentageDisplay">00.0%</strong>
      </div>
    </header>

    <!-- Center Chronometer Block: Time Display & Daily Lore Phase -->
    <main class="chronos-center">
      <div class="time-display" id="timeDisplay" title="Current Time">00:00:00</div>
      <div class="phase-subtitle" id="phaseText">AFTERNOON · Midday Vigil</div>
    </main>

    <!-- Stark's Vest Clasp / Martial Divider Motif -->
    <div class="vest-clasp-motif" aria-hidden="true">
      <span class="clasp-line left"></span>
      <span class="clasp-toggle">
        <span class="clasp-dot"></span>
        <span class="clasp-bar"></span>
        <span class="clasp-dot"></span>
      </span>
      <span class="clasp-line right"></span>
    </div>

    <!-- The Battle Axe Cleave Meter Assembly (Extended 92% track) -->
    <section class="progression-assembly" aria-label="Daily cleave progression track">
      
      <!-- The Weapon Shaft (Track: Extended 92% width polearm) -->
      <div class="progression-bar" id="progressionBar">
        
        <!-- Lightning Slash Energy Trail (Fill) -->
        <div class="progression-fill" id="progressionFill" style="width: 0%;"></div>

        <!-- Stark's Exact Battle Axe from Anime Series (Thumb) -->
        <div class="progression-thumb" id="progressionThumb" style="left: 0%;" title="Stark's Greataxe (Hover: Cowardice / Click: Lightning Strike)">
          <svg class="battle-axe-svg" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Stark's Battle Axe">
            <!-- 1. Top Conical Spear Finial Spire with Turned Rings -->
            <path class="axe-finial" d="M25 2L27.2 6.5L28.5 9H21.5L22.8 6.5L25 2Z" fill="#D0D3DC" stroke="#141518" stroke-width="0.8"/>
            <ellipse cx="25" cy="10" rx="3.5" ry="1.2" fill="#8E929D" stroke="#141518" stroke-width="0.7"/>
            <ellipse cx="25" cy="12.5" rx="4.5" ry="1.5" fill="#D0D3DC" stroke="#141518" stroke-width="0.7"/>

            <!-- 2. Rear (Secondary Left) Crescent Blade Body -->
            <path class="axe-blade-left" d="M23 16C18 15 13 13 8 9.5C6.5 18 6.5 32 8 40.5C13 37 18 35 23 34V16Z" fill="#2B2D33" stroke="#141518" stroke-width="0.8"/>
            <!-- Rear Silver Cutting Edge -->
            <path class="axe-edge-left" d="M8 9.5C6.5 18 6.5 32 8 40.5C9.8 34.5 9.8 15.5 8 9.5Z" fill="#E2E5EC"/>
            <path d="M8 11.5C7.2 19 7.2 31 8 38.5" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>

            <!-- 3. Front (Primary Right) Greataxe Crescent Blade Body -->
            <path class="axe-blade-right" d="M27 15C33 14 41 11 48 7C51 20 51 34 43.5 47C37 41.5 32 37.5 27 35V15Z" fill="#2B2D33" stroke="#141518" stroke-width="0.8"/>
            <!-- Front Blade Notches / Fullers from Anime Setting Sheet -->
            <rect x="36" y="16" width="3" height="1.5" rx="0.5" fill="#141518"/>
            <rect x="35" y="35" width="3" height="1.5" rx="0.5" fill="#141518"/>
            <!-- Front Wide Silver Cutting Edge with Beard Hook -->
            <path class="axe-edge-right" d="M48 7C51 20 51 34 43.5 47C45.2 38.5 46.2 18 48 7Z" fill="#E2E5EC"/>
            <!-- Front Razor Glint Highlight -->
            <path d="M47.5 9C49.8 20.5 49.8 33 44 44.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

            <!-- 4. Central Socket Sleeve & Mounting Brackets -->
            <rect class="axe-socket" x="23" y="13" width="4" height="23" fill="#383C45" stroke="#141518" stroke-width="0.8"/>
            <path class="axe-bracket" d="M21 16H29V19C27 20 27 22 29 23V27C27 28 27 30 29 31V35H21V31C23 30 23 28 21 27V23C23 22 23 20 21 19V16Z" fill="#8E929D" stroke="#141518" stroke-width="0.8"/>

            <!-- Central Core Boss / Rivet -->
            <circle class="axe-rivet" cx="25" cy="25" r="2.2" fill="#C8232B" stroke="#E2E5EC" stroke-width="0.8"/>

            <!-- 5. Lower Shaft Rings & Polearm Section -->
            <line x1="22" y1="37" x2="28" y2="37" stroke="#D0D3DC" stroke-width="1.6"/>
            <rect x="23.5" y="38" width="3" height="13" fill="#1E2025" stroke="#141518" stroke-width="0.8"/>
            <line x1="22" y1="44" x2="28" y2="44" stroke="#8E929D" stroke-width="1.2"/>
            <line x1="22" y1="50" x2="28" y2="50" stroke="#D0D3DC" stroke-width="1.6"/>
          </svg>
        </div>

      </div>

      <!-- Centered Combat Motto in Muted Iron Gray (Clean & Uncluttered) -->
      <footer class="track-telemetry">
        <span class="telemetry-motto">STRIKE WITH CONVICTION</span>
      </footer>

    </section>

  </article>

  <script src="../../../shared/js/day-progression.js"></script>
</body>
</html>
