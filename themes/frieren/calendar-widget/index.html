<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frieren: Beyond Journey's End — Calendar</title>

  <!-- Typography: Majestic Fantasy Serif (Cinzel) + Clean Rounded Modern Numerals (Quicksand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marcellus&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="frieren-calendar-root" id="frierenCalendarRoot">

    <!-- Header Section: Subtitle & Majestic Month Title + Controls -->
    <header class="calendar-header">
      <div class="brand-subtext" aria-label="Frieren: Beyond Journey's End">
        <span class="sparkle" aria-hidden="true">✦</span>
        <span>FRIEREN · CHRONICLES OF TIME</span>
        <span class="sparkle" aria-hidden="true">✦</span>
      </div>

      <div class="month-row">
        <div class="month-title">
          <h2 class="current-month-label" id="currentMonthLabel">SEPTEMBER</h2>
          <span class="current-year-label" id="currentYearLabel">2026</span>
        </div>

        <nav class="nav-controls" aria-label="Calendar Navigation">
          <button type="button" class="nav-arrow-btn" id="prevMonthBtn" aria-label="Previous Month">&#x2039;</button>
          
          <button type="button" class="today-btn" id="todayBtn" aria-label="Jump to Current Date">
            <span>TODAY</span>
          </button>

          <button type="button" class="nav-arrow-btn" id="nextMonthBtn" aria-label="Next Month">&#x203A;</button>
        </nav>
      </div>
    </header>

    <section class="calendar-board" aria-label="Calendar Board">
      
      <!-- Faint Teal Magic Circle SVG Watermark (Fixed Background Motif) -->
      <div class="magic-circle-bg" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="200" cy="200" r="188" stroke-width="1.6" />
            <circle cx="200" cy="200" r="176" stroke-dasharray="4 4" />
            <circle cx="200" cy="200" r="162" />
            <circle cx="200" cy="12" r="5" fill="currentColor" />
            <circle cx="200" cy="388" r="5" fill="currentColor" />
            <circle cx="12" cy="200" r="5" fill="currentColor" />
            <circle cx="388" cy="200" r="5" fill="currentColor" />
            <rect x="85" y="85" width="230" height="230" stroke-width="1.2" />
            <rect x="85" y="85" width="230" height="230" transform="rotate(45 200 200)" stroke-width="1.2" />
            <circle cx="200" cy="200" r="120" stroke-dasharray="6 6" />
            <circle cx="200" cy="200" r="90" stroke-width="1.4" />
            <polygon points="200,90 224,166 300,200 224,234 200,310 176,234 100,200 176,166" stroke-width="1.2" />
            <circle cx="200" cy="200" r="42" stroke-width="1.4" />
            <circle cx="200" cy="200" r="10" fill="currentColor" opacity="0.6" />
          </g>
        </svg>
      </div>

      <!-- Weekday Headers (Muted Gold/Grey) -->
      <div class="calendar-weekdays" aria-hidden="true">
        <span class="weekday weekend">SUN</span>
        <span class="weekday">MON</span>
        <span class="weekday">TUE</span>
        <span class="weekday">WED</span>
        <span class="weekday">THU</span>
        <span class="weekday">FRI</span>
        <span class="weekday weekend">SAT</span>
      </div>

      <!-- 7-Column Floating Date Grid (Populated via JS) -->
      <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Days Matrix"></div>

    </section>

    <!-- Poetic Footer Quote with Side Sparkle Divisors -->
    <footer class="calendar-footer">
      <span class="footer-sparkle" aria-hidden="true">✦</span>
      <span class="footer-quote" id="footerLoreText">
        Day 265 after the passing of Hero Himmel
      </span>
      <span class="footer-sparkle" aria-hidden="true">✦</span>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
