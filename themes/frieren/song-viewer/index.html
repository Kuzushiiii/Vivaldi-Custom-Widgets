<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fern — Song Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Widget Container: Full-Canvas Vertical Column Layout -->
  <article class="song-viewer-widget" id="songViewerWidget" data-status="playing">

    <!-- 1. Status Text (Top) -->
    <header class="status-header">
      <div class="status-indicator" id="statusIcon" title="Connection Status" aria-label="Connection Status">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label">FERN'S GRIMOIRE · DISPATCH</span>
      </div>
    </header>

    <!-- 2. The Zoltraak Magic Circle (Middle-Top) -->
    <figure class="magic-circle-stage">
      <div class="magic-circle-wrapper">
        <img
          id="albumArt"
          class="album-art"
          src=""
          alt="Track Cover Artwork"
        >
      </div>
    </figure>

    <!-- 3. Track Details & The Staff Progress Bar (Middle-Bottom) -->
    <section class="track-details-stage" aria-label="Track Information">
      <h1 id="trackTitle" class="track-title" title="Track Title">Awaiting Melody</h1>
      <p id="trackArtist" class="track-artist" title="Artist Name">Fern · Ordinary Offensive Magic</p>

      <!-- The Staff Progress Bar & Timestamps -->
      <div class="staff-assembly">
        <div
          id="progressBar"
          class="progress-bar"
          role="slider"
          aria-label="Track Progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          tabindex="0"
        >
          <!-- Solid Deep Purple Fill -->
          <div id="progressFill" class="progress-fill"></div>

          <!-- Fern's Butterfly Hair Ornament Indicator -->
          <div id="progressThumb" class="progress-thumb" aria-hidden="true">
            <!-- Inline SVG: Butterfly Silhouette -->
            <svg class="butterfly-svg" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <!-- Antennae -->
              <path d="M12 4.2c.4-.8 1.1-1.4 2-1.6.3-.1.6.1.7.4.1.3-.1.6-.4.7-.7.2-1.2.6-1.5 1.3-.1.2-.3.3-.5.3s-.4-.1-.5-.3c-.3-.7-.8-1.1-1.5-1.3-.3-.1-.5-.4-.4-.7.1-.3.4-.5.7-.4.9.2 1.6.8 2 1.6z"/>
              <!-- Slender Body -->
              <path d="M12 7c-.6 0-1 .6-1 1.5v6c0 .9.4 1.5 1 1.5s1-.6 1-1.5v-6c0-.9-.4-1.5-1-1.5z"/>
              <!-- Right Wings -->
              <path d="M13 7.8c1.8-1.5 4.8-2.2 7.2-1.1 2.2 1 2.7 3.5 1.8 5.7-.7 1.8-2.2 3.1-4 3.6 1.1 1.5 1.1 3.5-.1 4.7-1.3 1.3-3.4 1.3-5.3.3l-.4-.2v-2.2l.6.3c1.3.6 2.7.5 3.5-.3.8-.8.8-2.1.1-3.2l-.5-.7.8-.3c1.7-.6 2.9-1.7 3.5-3.1.6-1.5.2-3.1-1.2-3.7-1.8-.8-4.2-.2-5.7.9l-.4.3V7.8z"/>
              <!-- Left Wings -->
              <path d="M11 7.8c-1.8-1.5-4.8-2.2-7.2-1.1-2.2 1-2.7 3.5-1.8 5.7.7 1.8 2.2 3.1 4 3.6-1.1 1.5-1.1 3.5.1 4.7 1.3 1.3 3.4 1.3 5.3.3l.4-.2v-2.2l-.6.3c-1.3.6-2.7.5-3.5-.3-.8-.8-.8-2.1-.1-3.2l.5-.7-.8-.3c-1.7-.6-2.9-1.7-3.5-3.1-.6-1.5-.2-3.1 1.2-3.7 1.8-.8 4.2-.2 5.7.9l.4.3V7.8z"/>
            </svg>
          </div>
        </div>

        <!-- Timestamps -->
        <div class="time-readout">
          <span id="currentTime" class="time-stamp current">00:00</span>
          <span class="time-divider">/</span>
          <span id="totalTime" class="time-stamp total">00:00</span>
        </div>
      </div>
    </section>

  </article>

  <!-- Shared Song Viewer Service Script -->
  <script src="../../../shared/js/song-viewer-service.js"></script>
</body>
</html>
