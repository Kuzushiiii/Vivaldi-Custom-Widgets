<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Violet Evergarden — Typewriter Carriage Day Progression</title>

  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../theme-base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stationery-widget" id="dayProgressionWidget">

    <div class="stationery-inner">

      <header class="letterhead-header">
        <div class="letterhead-brand">
          <span class="postal-crest">⚜</span>
          <span class="postal-title">C·H POSTAL COMPANY · LEIDEN</span>
          <span class="postal-sub">CHRONOMETER DISPATCH</span>
        </div>
        <div class="letterhead-rule"></div>
      </header>

      <section class="readout-section">
        
        <div class="phase-container">
          <div class="phase-pill">
            <span class="phase-gem">◆</span>
            <span class="phase-title" id="phaseTitle">AFTERNOON MEMOIRS</span>
          </div>
          <span class="phase-desc" id="phaseDesc">Ink flows across vintage parchment</span>
        </div>

        <div class="stamped-stats">
          <div class="stat-block time-block">
            <span class="stat-caption">CURRENT TIME</span>
            <span class="stat-value typewriter-ink" id="liveClock">00:00:00</span>
          </div>

          <div class="stat-separator"></div>

          <div class="stat-block percent-block">
            <span class="stat-caption">DAY ELAPSED</span>
            <div class="stat-value-group">
              <span class="stat-value typewriter-ink" id="percentNum">00.0</span>
              <span class="stat-unit typewriter-ink">%</span>
            </div>
          </div>
        </div>

      </section>

      <section class="carriage-assembly">
        
        <div class="brass-ruler" aria-hidden="true">
          <div class="ruler-numbers">
            <span>0%</span>
            <span>20%</span>
            <span>40%</span>
            <span>60%</span>
            <span>80%</span>
            <span>100%</span>
          </div>
          <div class="ruler-ticks">
            <span class="tick major"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick major"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick major"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick major"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick major"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick major"></span>
          </div>
        </div>

        <div class="platen-track-container">
          
          <div class="platen-knob knob-left" title="Carriage Roller Knob">
            <div class="knob-core"></div>
          </div>

          <div class="platen-roller" id="platenRoller">
            <div class="roller-guide-wire"></div>

            <div class="typewriter-ribbon" id="ribbonFill">
              <div class="ribbon-black-stripe"></div>
              <div class="ribbon-red-stripe"></div>
              
              <div class="carriage-guide" id="carriageGuide">
                <div class="guide-arm top-arm"></div>
                <div class="guide-needle"></div>
                <div class="guide-arm bottom-arm"></div>
                <div class="strike-point"></div>
              </div>
            </div>
          </div>

          <div class="platen-knob knob-right" title="Carriage End & Return Lever">
            <button type="button" class="bell-return-btn" id="carriageReturnBtn" title="Trigger Carriage Return Bell ('Ding!')" aria-label="Carriage Return">
              <span class="bell-icon">🔔</span>
            </button>
          </div>

        </div>

      </section>

      <footer class="ledger-footer">
        <div class="footer-left">
          <span class="footer-label">TIME REMAINING:</span>
          <span class="footer-time typewriter-ink" id="timeRemaining">00H 00M 00S</span>
        </div>
        <div class="footer-right">
          <span class="doll-signature">“Auto Memory Doll: At your service.”</span>
        </div>
      </footer>

    </div>

  </div>

  <audio id="typewriterDing" src="../assets/ding.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
